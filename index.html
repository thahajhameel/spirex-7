
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Currency Converter</h1>
        <p>Convert currencies with ease.</p>

        <div class="converter">
            <label>Amount</label>
            <input type="number" id="amount" placeholder="Enter amount" value="1">

            <label>From</label>
            <select id="fromCurrency">
                <option value="INR">INR - Indian Rupee</option>
                <option value="USD">USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
            </select>

            <button id="swap">⇅ Swap Currencies</button>

            <label>To</label>
            <select id="toCurrency">
                <option value="USD">USD - US Dollar</option>
                <option value="INR">INR - Indian Rupee</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
            </select>

            <button id="convert">Convert Now</button>

            <div class="result">
                <h2 id="result">Your result will appear here</h2>
                <p id="rate"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
